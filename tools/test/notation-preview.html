<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{background:#fff;margin:10px;font-family:sans-serif}.r{border-bottom:1px solid #ddd;padding:4px}.r b{font-size:13px}</style></head><body><div id="out"></div>
<script src="../../vendor/opensheetmusicdisplay.min.js"></script>
<script type="module">
import { RUDIMENTS, pattern, strokes } from "../../js/tech/rudiments.js";
import { rudimentXML, setPitch } from "../../js/tech/notation.js";
import { techItems } from "../../js/shared/examdata.js";
/* ?n=1,2,3 = PAS 打法;?pattern=rsl-7-A(或 rsl-7 = 整級、可以逗號分隔多個)= RSL 的「依大綱時值」練習型(App 排的,不是官方譜),跟 PAS 官方表對照左右手、重音 */
const Q = new URLSearchParams(location.search);
const P = Q.get("p"); if (P) setPitch(P[0], P[1]);
async function draw(label, groups, reps){
  const d = document.createElement("div"); d.className = "r"; d.innerHTML = `<b></b><div></div>`; d.firstChild.textContent = label; document.getElementById("out").appendChild(d);
  const o = new opensheetmusicdisplay.OpenSheetMusicDisplay(d.lastChild, { backend: "svg", autoResize: false, drawTitle: false, drawPartNames: false, drawMeasureNumbers: false, drawingParameters: "compacttight", renderSingleHorizontalStaffline: true });
  try { await o.load(rudimentXML(groups, { reps })); o.zoom = 0.9; o.EngravingRules.TupletNumberLimitConsecutiveRepetitions = false; o.render(); } catch (e) { d.lastChild.textContent = "ERR " + e.message; }
}
if (Q.get("pattern")) {
  const data = await (await fetch("../../data/exam-rsl.json")).json();
  for (const spec of Q.get("pattern").split(",")) {
    const [, g, grp] = spec.match(/^rsl-(\d)(?:-([A-F]))?$/) || [];
    if (g == null) { await draw("? " + spec, [], 1); continue; }
    for (const it of techItems(Number(g), data).filter(x => x.kind === "pattern" && (!grp || x.group === grp))) {
      const groups = pattern(it), stick = strokes(groups).filter(s => s.kind !== "grace").map(s => s.hand + (s.kind === "accent" ? ">" : "")).join(" ");
      await draw(`${it.key} · PAS #${it.pas}${it.sticking ? " " + it.sticking : ""} · ${it.value}${it.assumed ? " (assumed)" : ""} · ♩=${it.bpm} · ${stick}`, groups, 1);
    }
  }
} else {
  const nos = (Q.get("n") || "1,2,3").split(",").map(Number);
  for (const no of nos) { const r = RUDIMENTS.find(x => x.no === no); await draw(`${no}. ${r.en}`, r.groups, no === 1 ? 4 : 1); }
}
window.__done = 1;
</script></body></html>
