<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C0A07">
<!-- 主題要在第一次繪製前套上,不然淺色使用者每次打開都會先閃一下深色 -->
<script>try{var s=JSON.parse(localStorage.getItem('drumdrill.v1')||'{}');if(s.theme==='light'){document.documentElement.classList.add('light');document.querySelector('meta[name="theme-color"]').content='#FBF7EE';}}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DrumDrill">
<meta name="application-name" content="DrumDrill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="DrumDrill 爵士鼓檢定特訓:PAS 40 個基本打法,鼓譜、左右手、真實鼓聲示範、速度階梯;Trinity / RSL 爵士鼓檢定。">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<title>DrumDrill 爵士鼓檢定特訓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=9f6af68d07">
<link rel="stylesheet" href="css/drum.css?v=56419077f1">
</head>
<body>
<header>
  <div class="header-left">
    <h1>Drum<span>Drill</span></h1>
    <span class="tagline" data-i18n="tagline">爵士鼓檢定特訓</span>
  </div>
  <div class="header-right">
    <button class="btn small ghost" id="examChip" hidden></button>
    <button class="btn" id="themeToggle" aria-pressed="false" data-i18n-attr="aria-label:themeToggleLabel,title:themeToggleTitle" aria-label="淺色模式" title="切換淺色/深色主題">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="btn" id="langToggle" aria-pressed="false" data-i18n-attr="aria-label:langToggleLabel,title:langToggleTitle" data-i18n="langToggleText">EN</button>
  </div>
  <!-- 各分頁的子項目(技巧:滾奏/複點/Flam/Drag;檢定:技巧/視奏/聽力);沒有子項目時整列收起 -->
  <nav class="subnav" id="subnav"><div class="seg" id="subSeg" role="group"></div></nav>
</header>

<main>
  <!-- 檢定:考試系統 + 級數設一次,三個項目都照這一級 -->
  <section class="card setup view-exam" id="examSetup" hidden>
    <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="m9 13 2 2 4-4"/></svg><span class="sum" id="examSum"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="setup-body">
      <div class="fields">
        <div class="field"><span class="lbl" data-i18n="lblSystem">考試系統</span>
          <div class="seg" id="systemSeg" role="group" aria-label="考試系統">
            <button data-v="trinity" aria-pressed="true">Trinity</button>
            <button data-v="rsl" aria-pressed="false">RSL</button>
          </div></div>
        <div class="field"><label for="selGrade" data-i18n="lblGrade">級數</label><select id="selGrade"></select></div>
      </div>
      <div class="exam-parts" id="examParts"></div>
    </div>
  </section>

  <!-- 技巧:PAS 40 個基本打法 -->
  <div class="mod" id="mod-tech" data-mod="tech">
    <div class="mod-side">
        <section class="card picker" id="t-picker">
          <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="setup-body"><div class="rows"></div></div>
        </section>
        <section class="card" id="t-examCard" hidden>
          <div class="card-title"><b data-i18n="tech.examTitle">本級要求</b><span class="sub" id="t-examTitle"></span></div>
          <p class="soon" id="t-examText"></p>
        </section>
        <section class="card" id="t-logCard">
          <div class="card-title"><b data-i18n="tech.logTitle">練習紀錄</b></div>
          <div class="log-stats">
            <div><b id="t-logStreak">0</b><small data-i18n="tech.logStreak">連續天數</small></div>
            <div><b id="t-logToday">0</b><small data-i18n="tech.logToday">今天次數</small></div>
            <div><b id="t-logMin">0</b><small data-i18n="tech.logMin">今天分鐘</small></div>
          </div>
          <div class="log-week" id="t-logWeek"></div>
        </section>
    </div>
    <div class="mod-main">
        <section class="card quiz" id="t-quizCard" aria-live="polite">
          <span class="loading" id="t-loadingMsg"></span>
          <div class="q-head">
            <div class="q-title" id="t-qTitle"></div>
            <button class="play-round" id="t-playBtn" disabled>
              <svg class="play-ring" id="t-playRing" viewBox="0 0 64 64" aria-hidden="true"><circle class="ring-bg" cx="32" cy="32" r="30" pathLength="1"/><circle class="ring-fg" cx="32" cy="32" r="30" pathLength="1"/></svg>
              <svg id="t-playIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg>
              <span class="sr" id="t-playLabel" data-i18n="tech.play">播放示範</span></button>
          </div>
          <div class="q-row">
            <div class="q-tags" id="t-qTags"></div>
            <div class="mastery">
              <button class="mbtn" data-m="good" aria-pressed="false" disabled data-i18n-attr="aria-label:tech.good,title:tech.good">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
              <button class="mbtn" data-m="weak" aria-pressed="false" disabled data-i18n-attr="aria-label:tech.weak,title:tech.weak">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18.4A2 2 0 0 0 3.5 21h17a2 2 0 0 0 1.7-2.6L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></button>
            </div>
          </div>
        </section>
        <section class="card" id="t-scoreCard">
          <div class="score-head"><div class="card-title" style="margin:0"><b data-i18n="tech.scoreTitle">鼓譜與左右手</b></div></div>
          <div class="paper" id="t-stage"><div id="t-scroll"><div id="t-osmd"></div></div><div id="t-playline" hidden></div><div class="paper-msg" id="t-paperMsg"></div></div>
        </section>
        <section class="card" id="t-metroCard">
          <div class="card-title"><b data-i18n="tech.metroTitle">速度</b><span class="sub" id="t-examTempo"></span><span class="best-tempo" id="t-bestTempo"></span></div>
          <div class="metro">
            <button class="btn round" id="t-bpmDown" data-i18n-attr="aria-label:tech.bpmDown,title:tech.bpmDown" aria-label="慢 1(按住連續減少)" title="慢 1(按住連續減少)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <div class="bpm"><b id="t-bpmVal">60</b><small id="t-bpmUnit">♩ / 分</small></div>
            <button class="btn round" id="t-bpmUp" data-i18n-attr="aria-label:tech.bpmUp,title:tech.bpmUp" aria-label="快 1(按住連續增加)" title="快 1(按住連續增加)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            <input type="range" id="t-bpmRange" min="30" max="240" step="1" value="60" data-i18n-attr="aria-label:tech.tempo" aria-label="速度" style="grid-column:1 / -1">
            <div class="row2"><div class="beats" id="t-beats"><i class="first"></i><i></i><i></i><i></i></div></div>
            <div class="play-opts">
              <button class="chip" id="t-optLoop" aria-pressed="false" data-i18n="tech.optLoop">循環播放</button>
              <button class="chip" id="t-optRamp" aria-pressed="false" data-i18n="tech.optRamp">每輪 +4</button>
              <button class="chip" id="t-optClick" aria-pressed="false" data-i18n="tech.optClick">只聽拍點</button>
            </div>
          </div>
        </section>
    </div>
  </div>

  <!-- 視奏(準備中) -->
  <div class="mod" id="mod-sight" data-mod="sight" hidden>
    <div class="mod-main">
      <section class="card"><div class="card-title"><b data-i18n="soonTitle">準備中</b></div><p class="soon" id="s-soonText"></p></section>
    </div>
  </div>
  <!-- 聽力(準備中) -->
  <div class="mod" id="mod-ear" data-mod="ear" hidden>
    <div class="mod-main">
      <section class="card"><div class="card-title"><b data-i18n="soonTitle">準備中</b></div><p class="soon" id="e-soonText"></p></section>
    </div>
  </div>

  <footer><p data-i18n="footer" data-i18n-pair></p><p class="foot-links"><a href="licenses.html" data-i18n="licenses">授權與出處</a> · <a href="privacy.html" data-i18n="privacy">隱私權政策</a></p></footer>
</main>

<!-- 底部分頁:順序照考試的順序 -->
<nav class="tabbar" id="tabbar" role="tablist" aria-label="練習項目">
  <button role="tab" data-view="tech" aria-selected="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 3 9 9"/><path d="m20 3-9 9"/><ellipse cx="12" cy="17" rx="8" ry="3"/><path d="M4 17v2c0 1.7 3.6 3 8 3s8-1.3 8-3v-2"/></svg><span data-i18n="tabTech">技巧</span></button>
  <button role="tab" data-view="sight" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12C4.6 7.2 8.2 5 12 5s7.4 2.2 10.2 7c-2.8 4.8-6.4 7-10.2 7S4.6 16.8 1.8 12Z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="tabSight">視奏</span></button>
  <button role="tab" data-view="ear" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0"/><path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4"/></svg><span data-i18n="tabEar">聽力</span></button>
  <button role="tab" data-view="exam" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="m9 13 2 2 4-4"/></svg><span data-i18n="tabExam">檢定</span></button>
</nav>

<!-- 第一次打開:在準備考試嗎? -->
<div class="modal" id="onboard" hidden role="dialog" aria-modal="true" aria-labelledby="onboardTitle">
  <div class="modal-card">
    <h2 id="onboardTitle" data-i18n="obTitle">你在準備爵士鼓檢定嗎?</h2>
    <p class="modal-sub" data-i18n="obSub" data-i18n-pair></p>
    <div class="field"><span class="lbl" data-i18n="lblSystem">考試系統</span>
      <div class="seg" id="obSystem" role="group">
        <button data-v="trinity" aria-pressed="true">Trinity</button>
        <button data-v="rsl" aria-pressed="false">RSL</button>
      </div></div>
    <div class="field"><label for="obGrade" data-i18n="lblGrade">級數</label><select id="obGrade"></select></div>
    <div class="modal-actions">
      <button class="btn primary" id="obYes" data-i18n="obYes">開始準備考試</button>
      <button class="btn ghost" id="obNo" data-i18n="obNo">不考試,自由練習</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js?v=398d81f426"></script>
</body>
</html>
