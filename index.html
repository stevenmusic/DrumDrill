<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C0A07">
<!-- 主題要在第一次繪製前套上,不然淺色使用者每次打開都會先閃一下深色 -->
<script>try{var s=JSON.parse(localStorage.getItem('drumdrill.v1')||'{}');if(s.theme==='light'){document.documentElement.classList.add('light');document.querySelector('meta[name="theme-color"]').content='#FBF7EE';}}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DrumDrill">
<meta name="application-name" content="DrumDrill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="DrumDrill 爵士鼓檢定特訓:PAS 40 個基本打法,鼓譜、左右手、真實鼓聲示範、速度階梯;Trinity / RSL 爵士鼓檢定。">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<title>DrumDrill 爵士鼓檢定特訓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=06379c4de5">
<link rel="stylesheet" href="css/drum.css?v=a8e111b678">
</head>
<body>
<header>
  <div class="header-left">
    <h1>Drum<span>Drill</span></h1>
    <span class="tagline" data-i18n="tagline">爵士鼓檢定特訓</span>
  </div>
  <div class="header-right">
    <button class="btn small ghost" id="examChip" hidden></button>
    <button class="btn" id="themeToggle" aria-pressed="false" data-i18n-attr="aria-label:themeToggleLabel,title:themeToggleTitle" aria-label="淺色模式" title="切換淺色/深色主題">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="btn" id="langToggle" aria-pressed="false" data-i18n-attr="aria-label:langToggleLabel,title:langToggleTitle" data-i18n="langToggleText">EN</button>
  </div>
  <!-- 各分頁的子項目(技巧:滾奏/複點/Flam/Drag;檢定:技巧/視奏/聽力);沒有子項目時整列收起 -->
  <nav class="subnav" id="subnav"><div class="seg" id="subSeg" role="group"></div></nav>
</header>

<main>
  <!-- 檢定:考試系統 + 級數設一次,三個項目都照這一級 -->
  <!-- 檢定頁的考試卡:不收起來;系統兩顆大鈕 + 級數一排(點一下就換;js/main.js 的 fillGradeSeg) -->
  <section class="card exam-card view-exam" id="examSetup" hidden>
    <div class="exam-sum"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="m9 13 2 2 4-4"/></svg><span class="sum" id="examSum"></span></div>
    <div class="exam-body">
      <div class="exam-pick">
        <div class="seg" id="systemSeg" role="group" data-i18n-attr="aria-label:lblSystem" aria-label="考試系統">
          <button data-v="trinity" aria-pressed="true">Trinity</button>
          <button data-v="rsl" aria-pressed="false">RSL</button>
        </div>
        <div class="seg exam-grades" id="gradeSeg" role="group" data-i18n-attr="aria-label:lblGrade" aria-label="級數"></div>
      </div>
      <!-- 本級三個項目的進度:點一下切到那一項 -->
      <div class="exam-parts" id="examParts"></div>
    </div>
  </section>

  <!-- 技巧:PAS 40 個基本打法 -->
  <div class="mod" id="mod-tech" data-mod="tech">
    <div class="mod-side">
        <section class="card picker" id="t-picker">
          <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="setup-body"><div class="rows"></div></div>
        </section>
        <!-- 檢定頁:考試摘要(手機收成一行;照 PianoDrill 的 t-paneExam) -->
        <section class="card setup pane" data-pane="exam" id="t-paneExam" hidden>
          <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 11h6M9 15h4"/></svg><span class="sum" id="t-examSummary"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="setup-body">
            <div class="card-title"><b data-i18n="sumTitle">考試摘要</b><span class="sub" id="t-sumSub"></span></div>
            <div id="t-sumSpec"></div>
            <p class="practice-only" id="t-sumNote"></p>
          </div>
        </section>
        <section class="card" id="t-logCard">
          <div class="card-title"><b data-i18n="tech.logTitle">練習紀錄</b></div>
          <div class="log-stats">
            <div><b id="t-logStreak">0</b><small data-i18n="tech.logStreak">連續天數</small></div>
            <div><b id="t-logToday">0</b><small data-i18n="tech.logToday">今天次數</small></div>
            <div><b id="t-logMin">0</b><small data-i18n="tech.logMin">今天分鐘</small></div>
          </div>
          <div class="goal"><div class="progress"><i id="t-goalBar" style="width:0"></i></div><button class="chip" id="t-goalBtn"></button></div>
          <div class="log-week" id="t-logWeek"></div>
        </section>
        <!-- 模擬考(S14,js/shared/mock.js):檢定頁的說明 + 開始;進行中:每一項的進度;結果:各項的練習回饋(.mock-res;不算總分、不出現等第、不換算官方分數);中止的說明 -->
        <section class="card mock-card" id="t-mockCard" hidden>
          <div class="card-title"><b id="t-mockTitle"></b><span class="sub" id="t-mockSub"></span></div>
          <p class="spec-note" id="t-mockText"></p>
          <div class="chips mock-opts" id="t-mockOpts" hidden><button class="chip" id="t-mockOneBar" aria-pressed="false"></button></div>
          <div id="t-mockList"></div>
          <div class="x-actions">
            <button class="btn primary" id="t-mockBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
              <span class="btn-label" id="t-mockLabel"></span></button>
            <button class="btn" id="t-mockClose" hidden><span class="btn-label" id="t-mockCloseLabel"></span></button>
          </div>
          <p class="practice-only" id="t-mockNote"></p>
        </section>
    </div>
    <div class="mod-main">
        <!-- 從檢定清單點「練習」:目標(哪一級哪一組、官方速度、頁碼;練習型另加「App 依大綱時值排的練習型 · 不是官方譜」與 practiceOnly);× 離開(速度回到自己的設定) -->
        <section class="card target" id="t-target" hidden>
          <svg class="target-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
          <p class="target-text" id="t-targetText"></p>
          <button class="btn ghost icon" id="t-targetList" data-i18n-attr="aria-label:tech.targetList,title:tech.targetList"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
          <button class="btn ghost icon" id="t-targetClose" data-i18n-attr="aria-label:tech.targetClose,title:tech.targetClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          <p class="target-note" id="t-targetNote" hidden></p>
        </section>
        <!-- 檢定頁:本級要求(RSL 每組一列;Trinity 說明 + 自選曲技巧) -->
        <section class="card pane" data-pane="exam" id="t-listCard" hidden>
          <div class="card-title"><b id="t-listTitle" data-i18n="tech.examTitle">本級要求</b><span class="sub" id="t-listSub"></span></div>
          <div class="progress" id="t-progress"><i id="t-progressBar" style="width:0"></i></div>
          <p class="spec-note" id="t-listRule"></p>
          <div id="t-qGroups"></div>
          <div class="x-actions" id="t-listActions">
            <button class="btn primary" id="t-drawBtn" hidden>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
              <span class="btn-label" id="t-drawLabel" data-i18n="tech.draw">隨機抽一項</span></button>
            <button class="btn" id="t-nextBtn" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
              <span class="btn-label" id="t-nextLabel" data-i18n="tech.next">下一項</span></button>
          </div>
          <p class="spec-note" id="t-listEmpty" hidden></p>
        </section>
        <section class="card quiz" id="t-quizCard">
          <span class="loading" id="t-loadingMsg"></span>
          <div class="q-head">
            <div class="q-title" id="t-qTitle"></div>
            <button class="play-round" id="t-playBtn" disabled>
              <svg class="play-ring" id="t-playRing" viewBox="0 0 64 64" aria-hidden="true"><circle class="ring-bg" cx="32" cy="32" r="30" pathLength="1"/><circle class="ring-fg" cx="32" cy="32" r="30" pathLength="1"/></svg>
              <svg id="t-playIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg>
              <span class="sr" id="t-playLabel" data-i18n="tech.play">播放示範</span></button>
          </div>
          <div class="q-row">
            <div class="q-tags" id="t-qTags"></div>
            <div class="mastery">
              <button class="mbtn" data-m="good" aria-pressed="false" disabled data-i18n-attr="aria-label:tech.good,title:tech.good">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
              <button class="mbtn" data-m="weak" aria-pressed="false" disabled data-i18n-attr="aria-label:tech.weak,title:tech.weak">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18.4A2 2 0 0 0 3.5 21h17a2 2 0 0 0 1.7-2.6L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></button>
            </div>
          </div>
          <!-- 模擬考進行中:這一項的說明、第幾組、下一組 -->
          <p class="feedback" id="t-mockMsg" hidden></p>
          <div class="q-foot" id="t-mockFoot" hidden>
            <span class="mock-step" id="t-mockStep"></span>
            <span style="flex:1"></span>
            <button class="btn primary" id="t-mockNext">
              <span class="btn-label" id="t-mockNextLabel"></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
          </div>
        </section>
        <section class="card" id="t-scoreCard">
          <div class="score-head"><div class="card-title" style="margin:0"><b data-i18n="tech.scoreTitle">鼓譜與左右手</b></div></div>
          <div class="paper" id="t-stage"><div id="t-scroll"><div id="t-osmd"></div></div><div id="t-playline" hidden></div><div class="paper-msg" id="t-paperMsg"></div></div>
        </section>
        <section class="card" id="t-metroCard">
          <div class="card-title"><b data-i18n="tech.metroTitle">速度</b><span class="sub" id="t-examTempo"></span><span class="best-tempo" id="t-bestTempo"></span></div>
          <div class="metro">
            <button class="btn round" id="t-bpmDown" data-i18n-attr="aria-label:tech.bpmDown,title:tech.bpmDown" aria-label="慢 1(按住連續減少)" title="慢 1(按住連續減少)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <div class="bpm"><b id="t-bpmVal">60</b><small id="t-bpmUnit">♩ / 分</small></div>
            <button class="btn round" id="t-bpmUp" data-i18n-attr="aria-label:tech.bpmUp,title:tech.bpmUp" aria-label="快 1(按住連續增加)" title="快 1(按住連續增加)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            <input type="range" id="t-bpmRange" min="30" max="240" step="1" value="60" data-i18n-attr="aria-label:tech.tempo" aria-label="速度" style="grid-column:1 / -1">
            <div class="row2"><div class="beats" id="t-beats"><i class="first"></i><i></i><i></i><i></i></div></div>
            <div class="play-opts">
              <button class="chip" id="t-optLoop" aria-pressed="false" data-i18n="tech.optLoop">循環播放</button>
              <button class="chip" id="t-optRamp" aria-pressed="false" data-i18n="tech.optRamp">每輪 +4</button>
              <button class="chip" id="t-optClick" aria-pressed="false" data-i18n="tech.optClick">只聽拍點</button>
            </div>
          </div>
        </section>
    </div>
  </div>

  <!-- 視奏(照 PianoDrill 視奏的卡片與流程):子項目 = 級數 0–8;RSL Debut–3 小鼓視奏出題(js/sight/gen.js),其他級數 / Trinity 只有說明卡;
       檢定頁:考試摘要 + 規格卡(不放練習紀錄、練習回饋) -->
  <div class="mod" id="mod-sight" data-mod="sight" hidden>
    <!-- 寬螢幕(≥1100)分兩欄:左 = 設定、紀錄;右 = 題目、譜、鼓墊。窄螢幕兩個容器都 display:contents,卡片照 order 排成一欄 -->
    <div class="mod-side">
        <section class="card rd-opts" id="s-rdOpts" hidden>
          <div class="rd-row"><span class="lbl" id="s-rdQuickLbl"></span><div class="rd-seg rd-seg4" id="s-rdQuick" role="group" aria-labelledby="s-rdQuickLbl"></div></div>
          <div class="rd-row"><span class="lbl" id="s-rdPiecesLbl"></span><div class="rd-seg rd-pieces" id="s-rdPieces" role="group" aria-labelledby="s-rdPiecesLbl"></div></div>
          <div class="rd-row"><span class="lbl" id="s-rdModeLbl"></span><div class="rd-seg rd-seg3" id="s-rdMode" role="group" aria-labelledby="s-rdModeLbl"></div></div>
          <p class="info rd-note" id="s-rdNote"></p>
        </section>
        <section class="card picker" id="s-setup">
          <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum" id="s-sum"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="setup-body">
            <div class="metro">
              <button class="btn round" id="s-bpmDown" data-i18n-attr="aria-label:sight.bpmDown,title:sight.bpmDown" aria-label="慢 1(按住連續減少)" title="慢 1(按住連續減少)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
              <div class="bpm"><b id="s-bpmVal">80</b><small id="s-bpmUnit">♩ / 分</small></div>
              <button class="btn round" id="s-bpmUp" data-i18n-attr="aria-label:sight.bpmUp,title:sight.bpmUp" aria-label="快 1(按住連續增加)" title="快 1(按住連續增加)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
              <input type="range" id="s-bpmRange" min="30" max="240" step="1" value="80" data-i18n-attr="aria-label:sight.tempo" aria-label="速度" style="grid-column:1 / -1">
              <div class="row2"><div class="beats" id="s-beats"><i class="first"></i><i></i><i></i><i></i></div><p class="info" id="s-tempoNote"></p></div>
              <div class="play-opts">
                <button class="chip" id="s-optMetro" aria-pressed="true" data-i18n="sight.optMetro">準備時節拍器</button>
                <button class="chip" id="s-optClick" aria-pressed="true" data-i18n="sight.optClick">正式打的拍點</button>
                <button class="chip" id="s-bpmReset" data-i18n="sight.bpmReset">官方速度</button>
              </div>
            </div>
          </div>
        </section>
        <!-- 檢定頁:考試摘要(手機收成一行) -->
        <section class="card setup pane" data-pane="exam" id="s-paneExam" hidden>
          <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 11h6M9 15h4"/></svg><span class="sum" id="s-examSummary"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="setup-body">
            <div class="card-title"><b data-i18n="sumTitle">考試摘要</b><span class="sub" id="s-sumSub"></span></div>
            <div id="s-sumSpec"></div>
            <p class="practice-only" id="s-sumNote"></p>
          </div>
        </section>
        <section class="card" id="s-logCard">
          <div class="card-title"><b data-i18n="sight.logTitle">練習紀錄</b></div>
          <div class="log-stats">
            <div><b id="s-logStreak">0</b><small data-i18n="sight.logStreak">連續天數</small></div>
            <div><b id="s-logToday">0</b><small data-i18n="sight.logToday">今天題數</small></div>
            <div><b id="s-logMin">0</b><small data-i18n="sight.logMin">今天分鐘</small></div>
          </div>
          <div class="goal"><div class="progress"><i id="s-goalBar" style="width:0"></i></div><button class="chip" id="s-goalBtn"></button></div>
          <div class="log-week" id="s-logWeek"></div>
        </section>
        <!-- 各分類練過題數 + 目前難度(練習回饋:檢定頁不放) -->
        <section class="card stats-card" id="s-statsCard">
          <div class="card-title"><b data-i18n="sight.statsTitle">各分類練過題數</b><span class="sub" id="s-statsSub"></span></div>
          <div class="stats" id="s-statsList"></div>
        </section>
        <!-- 模擬考(S14,js/shared/mock.js):檢定頁的說明 + 開始;進行中:每一項的進度;結果:各項的練習回饋(.mock-res;不算總分、不出現等第、不換算官方分數);中止的說明 -->
        <section class="card mock-card" id="s-mockCard" hidden>
          <div class="card-title"><b id="s-mockTitle"></b><span class="sub" id="s-mockSub"></span></div>
          <p class="spec-note" id="s-mockText"></p>
          <div class="chips mock-opts" id="s-mockOpts" hidden><button class="chip" id="s-mockMetro" aria-pressed="true" data-i18n="sight.optMetro">準備時節拍器</button></div>
          <div id="s-mockList"></div>
          <div class="x-actions">
            <button class="btn primary" id="s-mockBtn">
